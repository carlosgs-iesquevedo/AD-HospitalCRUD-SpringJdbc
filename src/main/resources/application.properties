spring.application.name=AD-HospitalCRUD-SpringJdbc

# En el fichero .env llevaremos las variables de entorno para la base de datos, usuario y contraseña
spring.config.import=optional:file:.env[.properties]

# Configuración de la conexión a la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital}
spring.datasource.username=${DB_USERNAME:xxxx}
spring.datasource.password=${DB_PASSWORD:xxxx}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Logging de JdbcClient/JdbcTemplate para ver las consultas y parámetros en la consola
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
